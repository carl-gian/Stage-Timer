<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage Timer Display</title>
<link rel="stylesheet" href="/steward.css">
<style>
  /* Options (URL query):  ?name=0  ?bar=0  ?mode=elapsed
     Always dark (class "stage" in steward.css): a white screen glares on stage and over OBS video. Never coral here. */
  * { box-sizing: border-box; }
  /* Brighter warning tones for the big digits only: the shared --warn-text/--danger-text
     are tuned for small text on a dark panel and read muddy at 38vmin across a hall. */
  .stage { --warn-bright: #ffc855; --danger-bright: #ff9b90; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--text); overflow: hidden;
    font-family: var(--font); -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vmin;
  }
  /* Nothing may push the page wider than the screen, or flex centring shifts everything sideways
     (shows up at phone width, where the section label is wider than the viewport). */
  body > * { max-width: 100%; }
  .section { font-size: max(3.4vmin, 11px); color: var(--brand); text-transform: uppercase; letter-spacing: .16em; font-weight: var(--weight-bold); text-align: center; padding: 0 4vw; }
  .name { font-size: 6.4vmin; color: var(--text-dim); font-weight: var(--weight-medium); text-align: center; padding: 0 4vw; }
  /* Big and bright: the speaker reads this from the platform, often past the lectern lights.
     vmin keeps it inside the shorter side; min() stops it overflowing a very wide screen. */
  .time {
    font-size: min(46vmin, 26vw); font-weight: var(--weight-black); line-height: 1; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; transition: color .2s; color: var(--text);
  }
  .bar { width: 70vw; flex: none; height: max(2vmin, 6px); background: var(--surface); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--brand); transition: background .2s; }

  /* Current time between parts (Settings → Clock) */
  .time small { font-size: 11vmin; color: var(--text-dim); margin-left: 1.5vmin; font-weight: var(--weight-bold); letter-spacing: 0; }
  .up { font-size: 4.2vmin; color: var(--text-dim); text-align: center; padding: 0 4vw; display: none; }
  .up b { color: var(--text); font-weight: var(--weight-bold); }
  body.now .time { color: var(--text); font-weight: var(--weight-bold); }
  body.now .section, body.now .name, body.now .bar, body.now .up { display: none; }

  /* Colour by stage (red stays darker than amber, so they differ in brightness too) */
  /* Running is full white; only idle and stopped go dim, so "dim" still means "not counting". */
  [data-state="idle"] .time, [data-state="stopped"] .time { color: var(--text-dim); }
  [data-state="minute"] .time, [data-state="half"] .time { color: var(--warn-bright); }
  [data-state="ten"] .time, [data-state="up"] .time, [data-state="over"] .time { color: var(--danger-bright); }
  [data-state="minute"] .bar > i, [data-state="half"] .bar > i { background: var(--warn); }
  [data-state="ten"] .bar > i, [data-state="up"] .bar > i, [data-state="over"] .bar > i { background: var(--danger); }

  /* Motion by stage: slow amber glow -> amber flash -> faster red flash -> flashing time's up */
  [data-state="stopped"] .time { animation: dim 1.4s ease-in-out infinite; }
  [data-state="minute"] .time { animation: glow 2.2s ease-in-out infinite; }
  [data-state="half"] .time { animation: flash 1s ease-in-out infinite; }
  [data-state="ten"] .time { animation: flash .8s ease-in-out infinite; }
  [data-state="up"] .time { animation: flash .7s ease-in-out infinite; }
  @keyframes dim { 50% { opacity: .55; } }
  /* Dips to .35, not .12: the flash must still be obvious without hiding the digits. */
  @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes glow { 0%, 100% { text-shadow: 0 0 .05em color-mix(in srgb, var(--warn) 15%, transparent); } 50% { text-shadow: 0 0 .3em color-mix(in srgb, var(--warn) 95%, transparent), 0 0 .8em color-mix(in srgb, var(--warn) 55%, transparent); } }

  /* Edge flash around the whole screen */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0; }
  [data-state="half"]::after { box-shadow: inset 0 0 9vmin color-mix(in srgb, var(--warn) 75%, transparent); animation: edge 1s ease-in-out infinite; }
  [data-state="ten"]::after { box-shadow: inset 0 0 11vmin color-mix(in srgb, var(--danger) 85%, transparent); animation: edge .8s ease-in-out infinite; }
  [data-state="up"]::after { box-shadow: inset 0 0 13vmin color-mix(in srgb, var(--danger) 95%, transparent); animation: edge .7s ease-in-out infinite; }
  @keyframes edge { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

  /* Zoom raised hand: takes over the screen. The border glows amber, smoothly, in and out. */
  .raise { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; background: var(--page); text-align: center; padding: 0 6vw; }
  .raise.show { display: flex; }
  .raise::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border: 3vmin solid var(--warn-bright, var(--warn));
    box-shadow: inset 0 0 8vmin color-mix(in srgb, var(--warn) 85%, transparent), 0 0 6vmin color-mix(in srgb, var(--warn) 80%, transparent);
    animation: raiseGlow 1.8s ease-in-out infinite;
  }
  .raise[data-mode="cancelled"]::after { display: none; }
  .raise .big { font-size: min(15vmin, 8.5vw); font-weight: var(--weight-black); line-height: 1.05; color: var(--warn-bright, var(--warn)); letter-spacing: -0.02em; }
  /* The name is the biggest thing on the screen: bigger than the heading. JS lowers the size for long names. */
  .raise .who { font-size: min(20vmin, 11vw); font-weight: var(--weight-black); line-height: 1.05; color: var(--text); letter-spacing: -0.02em; max-width: 92vw; overflow-wrap: anywhere; }
  .raise .who:empty { display: none; }
  .raise .sub { font-size: min(7.5vmin, 5vw); font-weight: var(--weight-bold); color: var(--text); }
  .raise[data-mode="cancelled"] .big { color: var(--text-dim); font-size: min(12vmin, 6.5vw); }
  @keyframes raiseGlow { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  /* Countdown ring for the raise hand: white, drains clockwise. It never turns amber or red: those mean warnings here. */
  .ring { position: relative; width: 12vmin; height: 12vmin; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 9; }
  .ring .trk { stroke: rgba(255,255,255,.25); }
  .ring .arc { stroke: #fff; stroke-linecap: round; stroke-dasharray: 100; transition: stroke-dashoffset .25s linear; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 5.4vmin; font-weight: var(--weight-black); color: #fff; font-variant-numeric: tabular-nums; }
  .ring.low { animation: ringPulse 1s ease-in-out infinite; }
  .ring.paused .arc { stroke-dasharray: 4 5; opacity: .6; transition: none; }
  @keyframes ringPulse { 50% { transform: scale(1.1); } }
  #ringFull { position: absolute; right: 5vmin; bottom: 5vmin; }
  #ringFull .trk { stroke: rgba(255,255,255,.18); }

  /* Raised hand as a banner across the top (the default): blue, because amber and red already mean warnings here.
     It slides in once and then stays still. The timer stays in view, moved down just enough to clear it. */
  .rbanner {
    position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: 15vh; min-height: 15vmin;
    display: flex; align-items: center; gap: 3vmin; padding: 0 4vw; color: #fff; background: #0b5cff;
    box-shadow: 0 1.2vmin 5vmin rgba(11,92,255,.55);
    transform: translateY(-110%); transition: transform .4s var(--ease-pop); visibility: hidden;
  }
  .rbanner.show { transform: none; visibility: visible; }
  .rbanner .lab { font-size: 3.4vmin; font-weight: var(--weight-bold); letter-spacing: .12em; white-space: nowrap; opacity: .92; }
  .rbanner .nm { flex: 1; min-width: 0; font-size: 9vmin; font-weight: var(--weight-black); line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
  .rbanner .mic { display: none; font-size: 3.6vmin; font-weight: var(--weight-bold); color: #0b5cff; background: #fff; border-radius: 99px; padding: 1vmin 2.4vmin; white-space: nowrap; }
  .rbanner[data-mode="unmute"] .mic { display: block; }
  .rbanner[data-mode="cancelled"] { background: #4a5568; box-shadow: 0 1.2vmin 5vmin rgba(0,0,0,.4); }
  .rbanner[data-mode="cancelled"] .ring { display: none; }
  body { transition: padding-top .4s var(--ease-pop); }
  body.rb { padding-top: 15vh; }

  /* Pop-up message */
  .popup {
    position: fixed; z-index: 30; top: 6vmin; left: 50%; transform: translate(-50%, -140%); opacity: 0;
    font-size: 6vmin; font-weight: var(--weight-bold); padding: 1.4vmin 4vmin; border-radius: 99px; white-space: nowrap;
    color: #1b1200; background: var(--warn); box-shadow: 0 1vmin 4vmin rgba(0,0,0,.4);
    transition: transform .35s var(--ease-pop), opacity .25s, visibility 0s .35s; pointer-events: none; visibility: hidden;
  }
  .popup.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition-delay: 0s; }
  .popup[data-kind="ten"], .popup[data-kind="up"] { background: var(--danger); color: var(--on-danger); }
  .popup[data-kind="up"] { font-size: 8vmin; }
  .popup.show[data-kind="up"] { animation: flash .7s ease-in-out infinite; } /* only while shown: a hidden pop-up must not keep flashing */

  .offline { position: fixed; bottom: 1.5vmin; right: 2vmin; font-size: 2.4vmin; color: var(--danger-text); display: none; }
  body.off .offline { display: block; }
  .hide { display: none !important; }

  /* Reduced motion: warnings turn steady; colour, edge and words still change */
  @media (prefers-reduced-motion: reduce) {
    .time, .popup, body::after, .raise::after, .ring { animation: none !important; }
    .rbanner, body { transition: none; }
    [data-state="half"]::after, [data-state="ten"]::after, [data-state="up"]::after { opacity: 1; }
  }
</style>
</head>
<body class="stage" data-state="idle">
  <div class="section" id="section"></div>
  <div class="name" id="name">Waiting for schedule…</div>
  <div class="time" id="time">0:00</div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="up" id="up">Up next: <b id="upName"></b><span id="upDur"></span></div>
  <div class="raise" id="raise"><div class="big" id="raiseBig"></div><div class="who" id="raiseWho"></div><div class="sub" id="raiseSub"></div><div class="ring" id="ringFull"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="arc" cx="50" cy="50" r="44" pathLength="100"/></svg><b></b></div></div>
  <div class="rbanner" id="rbanner" role="status"><span class="lab">✋ ZOOM</span><span class="nm" id="rbName"></span><span class="mic" id="rbMic">🎤 Unmute</span><div class="ring" id="ringBanner"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="trk" cx="50" cy="50" r="44"/><circle class="arc" cx="50" cy="50" r="44" pathLength="100"/></svg><b></b></div></div>
  <div class="popup" id="popup"></div>
  <div class="offline">● reconnecting…</div>
<script src="/client.js"></script>
<script>
  const $ = (id) => document.getElementById(id); // (window.name is built in, so no id-globals)
  const q = new URLSearchParams(location.search);
  if (q.get('name') === '0') { $('name').classList.add('hide'); $('section').classList.add('hide'); $('up').classList.add('hide'); }
  if (q.get('bar') === '0') $('bar').classList.add('hide');
  const elapsedMode = q.get('mode') === 'elapsed';

  let last = null;
  const conn = ST.connect((s) => { last = s; }, (ok) => document.body.classList.toggle('off', !ok));
  const alerter = ST.alerter($('popup'));

  const RAISE = {
    hand: ['✋ ZOOM Raise Hand', ''],
    unmute: ['✋ ZOOM Raise Hand', 'Conductor: ask them to unmute'],
    cancelled: ['Zoom raise hand cancelled', ''],
  };
  let raiseMode = '';
  const setRing = (el, secs, total, paused) => {
    el.querySelector('b').textContent = Math.max(0, Math.ceil(secs));
    el.querySelector('.arc').style.strokeDashoffset = (100 - Math.max(0, Math.min(1, secs / total)) * 100).toFixed(1);
    el.classList.toggle('low', !paused && secs <= 10);
    el.classList.toggle('paused', !!paused);
  };
  function drawRaise() {
    const r = last.raise;
    const nowMs = Date.now() + conn.offset();
    const left = r ? (r.paused ? r.remainingMs : r.endsAt - nowMs) : 0;
    const mode = r && (r.paused || nowMs < r.endsAt + 1000) ? r.mode : ''; // a stale message never lingers
    const banner = last.raiseStyle !== 'full';
    const who = mode === 'hand' || mode === 'unmute' ? (r.name || '') : '';
    const key = mode + '|' + who + '|' + banner;
    if (key !== raiseMode) {
      raiseMode = key;
      $('raise').classList.toggle('show', !!mode && !banner);
      $('raise').dataset.mode = mode;
      $('rbanner').classList.toggle('show', !!mode && banner);
      $('rbanner').dataset.mode = mode;
      document.body.classList.toggle('rb', !!mode && banner);
      if (mode) { $('raiseBig').textContent = RAISE[mode][0]; $('raiseSub').textContent = RAISE[mode][1]; }
      $('raiseWho').textContent = who;
      // Short names get the full size; a long one shrinks (and may take two lines) so it still fits across the screen.
      const lines = who.length <= 14 ? 1 : 2;
      const em = Math.max(4, lines === 1 ? who.length : Math.ceil(who.length / 2) + 1) * 0.6;
      $('raiseWho').style.fontSize = 'min(20vmin, ' + (88 / em).toFixed(2) + 'vw)';
      // The banner has one line: the name, or "Raise Hand" until one is sent.
      $('rbName').textContent = mode === 'cancelled' ? 'Raise hand cancelled' : who || 'Raise Hand';
      $('rbName').style.fontSize = 'min(9vmin, ' + (62 / (Math.max(8, $('rbName').textContent.length) * 0.6)).toFixed(2) + 'vw)';
    }
    if (mode && mode !== 'cancelled') {
      const total = r.totalSecs || 45;
      setRing($('ringBanner'), left / 1000, total, r.paused);
      setRing($('ringFull'), left / 1000, total, r.paused);
    }
  }

  function draw() {
    if (last) {
      drawRaise();
      const v = ST.view(last, conn.offset());
      document.body.dataset.state = v.state;
      // With no timer going (nothing started yet), the screen shows just the time of day.
      const now = v.state === 'idle';
      document.body.classList.toggle('now', now);
      $('name').textContent = last.talk ? last.talk.name : 'No schedule';
      if (now) {
        const c = ST.clockTime(new Date(Date.now() + conn.offset()), last.clock ? last.clock.format : '12h');
        $('time').textContent = c.time;
        if (c.ampm) $('time').appendChild(document.createElement('small')).textContent = c.ampm;
      } else {
        $('section').textContent = last.talk ? last.talk.section : '';
        $('time').textContent = elapsedMode ? ST.fmt(ST.elapsed(last, conn.offset()) / 1000) : v.text;
      }
      $('fill').style.width = (v.progress * 100).toFixed(2) + '%';
      alerter(v.state, last.currentId);
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
