<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a2b" media="(prefers-color-scheme: dark)">
<title>Stage Timer Control</title>
<script>
  // The OBS dock sits inside OBS's dark window: always dark there, so it never glares
  if (location.pathname === '/dock') document.documentElement.dataset.theme = 'dark';
</script>
<link rel="stylesheet" href="/steward.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--page); }
  body { margin: 0; background: var(--page); color: var(--text); font-family: var(--font); font-size: var(--text-md); line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg.art { display: block; width: 100%; height: 100%; }

  /* ---- Top bar ---- */
  header { display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap-main); padding: var(--space-2) var(--space-5); border-bottom: 1px solid var(--line); }
  header h1 { flex: 1; min-width: 0; margin: 0; font-size: var(--text-lg); font-weight: var(--weight-black); letter-spacing: -0.02em; line-height: 1.2; }
  header h1 small { display: block; color: var(--text-dim); font-size: var(--text-xs); font-weight: var(--weight-regular); letter-spacing: 0; }
  .icons { display: flex; align-items: center; gap: var(--space-2); }
  .ib { display: none; align-items: center; min-height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-pill); border: 1.5px solid var(--line); background: var(--page); color: var(--text); font-size: var(--text-sm); font-weight: var(--weight-bold); text-decoration: none; white-space: nowrap; }
  .ib.show { display: inline-flex; }
  .ib.on { border-color: var(--brand); color: var(--brand-strong); }
  @media (hover: hover) { .ib:hover { border-color: var(--brand); } }
  .now { font-size: var(--text-lg); font-weight: var(--weight-bold); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .now small { font-size: var(--text-xs); color: var(--text-dim); font-weight: var(--weight-bold); margin-left: 2px; }
  .conn { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-pill); font-size: var(--text-xs); font-weight: var(--weight-bold); white-space: nowrap;
    background: color-mix(in srgb, var(--danger) 12%, var(--page)); color: var(--danger-text); }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
  .conn.on { background: color-mix(in srgb, var(--ok) 12%, var(--page)); color: var(--ok-text); }
  .conn.on i { background: var(--ok); }

  /* ---- Three columns on a laptop: plan, act, check ---- */
  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; min-height: calc(100vh - 57px); }
  .plan { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  .act { padding: var(--space-6); display: flex; flex-direction: column; min-width: 0; }
  .check { border-left: 1px solid var(--line); background: var(--surface); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); }
  .check h4 { margin: 0 0 var(--space-2); font-size: var(--text-sm); color: var(--text-dim); font-weight: var(--weight-medium); }

  /* Art only at the edge: a short banner over the schedule, never behind the timer */
  .side-hero { position: relative; height: 150px; flex: none; }
  .side-hero .art-banner { position: absolute; inset: 0 0 30px; -webkit-mask-image: linear-gradient(#000 50%, transparent); mask-image: linear-gradient(#000 50%, transparent); }
  .side-hero .t { position: absolute; left: var(--space-5); right: var(--space-5); bottom: 4px; }
  .side-hero small { display: block; color: var(--text-dim); font-size: var(--text-xs); }
  .side-hero b { color: var(--coral); font-size: var(--text-lg); }
  #list { padding: var(--space-3); }
  #list h2 { font-size: var(--text-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); font-weight: var(--weight-bold); margin: var(--space-4) var(--space-3) var(--space-1); }
  #list h2:first-child { margin-top: var(--space-1); }
  .part { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: var(--tap-min); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); text-align: left; font-size: var(--text-sm); line-height: 1.3; }
  @media (hover: hover) { .part:hover { background: var(--surface); } }
  .part .n { flex: 1; min-width: 0; }
  .part .d { color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .part .d.chg { color: var(--brand-strong); }
  .part .d.ad { color: var(--warn-text); }
  .part .d s { opacity: .7; margin-right: 6px; }
  .part .dot { width: 8px; height: 8px; flex: none; margin: 0 4px; border-radius: 50%; border: 1.5px solid var(--text-dim); }
  .part.done { color: var(--text-dim); }
  .part.done .dot { border-color: var(--ok); background: var(--ok); }
  .part.cur { background: var(--brand-soft); color: var(--brand-strong); font-weight: var(--weight-bold); box-shadow: inset 3px 0 0 var(--brand); }
  .part.cur .d { color: var(--brand-strong); }
  .part.cur .dot { background: var(--brand); border-color: var(--brand); }
  .plan .foot { margin-top: auto; padding: var(--space-4) var(--space-5); border-top: 1px solid var(--line); display: flex; gap: var(--space-2); }
  .plan .foot:not(:has(.show)) { display: none; }

  /* ---- Notices ---- */
  .banner { display: none; margin-bottom: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); font-size: var(--text-sm);
    background: color-mix(in srgb, var(--warn) 12%, var(--page)); box-shadow: inset 4px 0 0 var(--warn); }
  .banner.pace { background: color-mix(in srgb, var(--brand) 10%, var(--page)); box-shadow: inset 4px 0 0 var(--brand); }
  .banner button { color: var(--brand-strong); font-weight: var(--weight-bold); text-decoration: underline; padding: 0 0 0 6px; }

  .connect { display: none; gap: var(--space-4); align-items: center; padding: var(--space-4); margin-bottom: var(--space-3); border-radius: var(--radius-md); background: var(--surface); }
  .connect.show { display: flex; }
  .connect .qr { width: 120px; height: 120px; flex: none; border-radius: var(--radius-sm); overflow: hidden; background: #fff; padding: 6px; }
  .connect .qr svg { width: 100%; height: 100%; display: block; }
  .connect .pin { font-size: 30px; font-weight: var(--weight-black); letter-spacing: .2em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .connect small { display: block; color: var(--text-dim); font-size: var(--text-xs); word-break: break-all; }
  .connect .lbl { color: var(--text-dim); font-size: var(--text-xs); margin-top: var(--space-2); }

  /* ---- The timer ---- */
  .clock { position: relative; }
  .clock .sec { font-size: var(--text-sm); color: var(--text-dim); }
  .clock .nm { margin: 0; font-size: var(--text-xl); font-weight: var(--weight-bold); line-height: 1.2; min-height: 1.2em; }
  .clock .t { font-size: 128px; font-weight: var(--weight-black); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin: var(--space-4) 0 var(--space-2); transition: color .2s; }
  .clock .meta { color: var(--text-dim); font-size: var(--text-sm); min-height: 1.45em; }
  .bar { height: 8px; border-radius: var(--radius-pill); background: var(--brand-soft); overflow: hidden; margin: var(--space-4) 0 var(--space-6); }
  .bar i { display: block; height: 100%; width: 0; background: var(--brand); }

  /* Colour by stage, with motion and words too, so colour is never the only signal */
  [data-state="idle"] .t, [data-state="stopped"] .t { color: var(--text-dim); }
  [data-state="minute"] .t, [data-state="half"] .t { color: var(--warn-text); }
  [data-state="ten"] .t, [data-state="up"] .t, [data-state="over"] .t { color: var(--danger-text); }
  [data-state="minute"] .bar i, [data-state="half"] .bar i { background: var(--warn); }
  [data-state="ten"] .bar i, [data-state="up"] .bar i, [data-state="over"] .bar i { background: var(--danger); }
  /* glow -> amber flash -> red flash -> flashing time's up (same ladder as the display) */
  [data-state="minute"] .t { animation: glow 2.2s ease-in-out infinite; }
  [data-state="half"] .t { animation: flash 1s ease-in-out infinite; }
  [data-state="ten"] .t { animation: flash .8s ease-in-out infinite; }
  [data-state="up"] .t { animation: flash .7s ease-in-out infinite; }
  @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
  @keyframes glow { 0%, 100% { text-shadow: 0 0 2px color-mix(in srgb, var(--warn) 20%, transparent); } 50% { text-shadow: 0 0 18px color-mix(in srgb, var(--warn) 80%, transparent), 0 0 40px color-mix(in srgb, var(--warn) 45%, transparent); } }
  .clock::after { content: ""; position: absolute; inset: calc(var(--space-3) * -1); pointer-events: none; border-radius: var(--radius-md); opacity: 0; }
  [data-state="half"].clock::after { box-shadow: inset 0 0 0 3px var(--warn); animation: flash 1s ease-in-out infinite; }
  [data-state="ten"].clock::after { box-shadow: inset 0 0 0 3px var(--danger); animation: flash .8s ease-in-out infinite; }
  [data-state="up"].clock::after { box-shadow: inset 0 0 0 4px var(--danger); animation: flash .7s ease-in-out infinite; }
  .popup { position: absolute; top: 0; left: 50%; transform: translate(-50%, -40%); opacity: 0; padding: 6px 16px; border-radius: var(--radius-pill); font-weight: var(--weight-bold); font-size: 15px; white-space: nowrap;
    background: var(--warn); color: #1b1200; box-shadow: var(--shadow); transition: transform .3s var(--ease-pop), opacity .2s; pointer-events: none; z-index: 2; }
  .popup.show { transform: translate(-50%, 0); opacity: 1; }
  .popup[data-kind="ten"], .popup[data-kind="up"] { background: var(--danger); color: var(--on-danger); }
  .popup[data-kind="up"] { animation: flash .7s ease-in-out infinite; }

  .main { display: flex; gap: var(--space-3); }
  .main button { min-height: var(--tap-main); padding: 0 var(--space-5); border-radius: var(--radius-pill); font-size: var(--text-md); font-weight: var(--weight-bold); border: 1.5px solid var(--line); background: var(--page); transition: transform .12s ease-out; }
  .main button:active:not(:disabled) { transform: scale(.97); }
  .main .go { flex: 1; font-size: var(--text-lg); border: 0; background: var(--brand); color: var(--on-brand); }
  .main .go.stop { background: var(--danger); color: var(--on-danger); }
  @media (hover: hover) { .main .go:hover:not(:disabled):not(.stop) { background: var(--brand-strong); } .main .reset:hover:not(:disabled) { border-color: var(--brand); } }
  .adj { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin-top: var(--space-3); }
  .adj button { min-height: var(--tap-min); border-radius: var(--radius-sm); background: var(--surface); font-weight: var(--weight-bold); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
  .adj button:active { background: var(--line); }
  .adjlabel { text-align: center; color: var(--text-dim); font-size: var(--text-xs); margin-top: var(--space-2); }

  .scenes { display: none; margin-top: auto; padding-top: var(--space-5); }
  .scenes.show { display: grid; gap: var(--space-2); }
  .srow { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); color: var(--text-dim); }
  .srow label { flex: none; width: 140px; }
  .srow select { flex: 1; min-width: 0; height: var(--tap-min); border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--page); color: var(--text); padding: 0 var(--space-3); }

  /* ---- Check: what the speaker sees, the time, connections ---- */
  .preview { aspect-ratio: 16 / 9; border-radius: var(--radius-sm); background: var(--page); color: var(--text); display: grid; place-content: center; text-align: center; container-type: size; overflow: hidden; }
  .preview small { font-size: 8cqh; color: var(--text-dim); padding: 0 6cqw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview b { font-size: 34cqh; font-weight: var(--weight-black); line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  .preview b small { font-size: 12cqh; padding: 0 0 0 1cqw; font-weight: var(--weight-bold); }
  .preview[data-state="idle"] b, .preview[data-state="stopped"] b { color: var(--text-dim); }
  .preview[data-state="now"] b { color: var(--text); }
  .preview[data-state="minute"] b, .preview[data-state="half"] b { color: var(--warn-text); }
  .preview[data-state="ten"] b, .preview[data-state="up"] b, .preview[data-state="over"] b { color: var(--danger-text); }
  .clockcard { display: flex; align-items: center; gap: var(--space-3); }
  .clockcard .face { width: 64px; height: 64px; flex: none; }
  .clockcard b { display: block; font-size: var(--text-xl); font-weight: var(--weight-black); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .clockcard b small { font-size: var(--text-sm); color: var(--text-dim); font-weight: var(--weight-bold); margin-left: 3px; }
  .clockcard span { color: var(--text-dim); font-size: var(--text-xs); }
  .status { display: grid; gap: var(--space-2); }
  .status div { display: flex; justify-content: space-between; align-items: center; font-size: var(--text-sm); }

  /* ---- PIN ---- */
  .gate { position: fixed; inset: 0; background: color-mix(in srgb, var(--page) 70%, transparent); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: var(--space-5); z-index: 10; }
  .gate.show { display: flex; }
  .gate form { background: var(--page); box-shadow: var(--shadow), 0 0 0 1px var(--line); border-radius: var(--radius-lg); padding: var(--space-5); width: 100%; max-width: 340px; text-align: center; }
  .gate h3 { margin: 0 0 var(--space-1); font-size: var(--text-lg); } .gate p { margin: 0 0 var(--space-4); color: var(--text-dim); font-size: var(--text-sm); }
  .gate input { width: 100%; font-size: 28px; letter-spacing: .4em; text-align: center; padding: 10px; border-radius: var(--radius-md); border: 1.5px solid var(--line); background: var(--surface); color: var(--text); font-variant-numeric: tabular-nums; }
  .gate .err { color: var(--danger-text); font-size: var(--text-sm); min-height: 20px; margin: var(--space-2) 0; }
  .gate button { width: 100%; min-height: var(--tap-main); border-radius: var(--radius-pill); background: var(--brand); color: var(--on-brand); font-weight: var(--weight-bold); font-size: var(--text-md); }

  /* ---- Smaller screens ---- */
  @media (min-width: 1100px) { header .now { display: none; } } /* the time sits in the right column instead */
  @media (max-width: 1099px) {
    .layout { grid-template-columns: 280px minmax(0, 1fr); }
    .check { display: none; }
  }
  @media (max-width: 759px) {
    header { padding: var(--space-2) var(--space-4); }
    .layout { display: flex; flex-direction: column; min-height: 0; }
    .act { order: 1; padding: var(--space-4) var(--space-4) 0; }
    .plan { order: 2; border-right: 0; }
    .side-hero { display: none; }
    #list { padding: var(--space-2) var(--space-2) calc(var(--space-5) + env(safe-area-inset-bottom)); }
    .clock { text-align: center; padding-top: var(--space-2); }
    .clock .nm { font-size: var(--text-lg); }
    .clock .t { font-size: 76px; margin: var(--space-2) 0 var(--space-1); }
    .bar { margin: var(--space-3) 0 var(--space-4); }
    .scenes { margin-top: 0; }
    .plan .foot { border-top: 0; padding-top: 0; }
  }
  /* Narrow OBS dock */
  @media (max-width: 380px) {
    header { padding: var(--space-2) var(--space-3); gap: var(--space-2); }
    header h1 { font-size: var(--text-md); }
    .ib { padding: 0 var(--space-3); }
    .act { padding: var(--space-3) var(--space-3) 0; }
    .clock .t { font-size: 56px; }
    .main button { min-height: 52px; padding: 0 var(--space-4); }
    .srow { flex-direction: column; align-items: stretch; gap: var(--space-1); } .srow label { width: auto; }
    .connect { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Stage Timer<small id="sub"></small></h1>
  <div class="icons">
    <div class="now" id="now" hidden></div>
    <button class="ib show" id="connectBtn" title="Show QR code and PIN for phones">Connect</button>
    <button class="ib" id="settingsBtn" title="Open Stage Timer settings">Settings</button>
    <div class="conn" id="conn"><i></i><span>Connecting</span></div>
  </div>
</header>

<div class="layout">
  <aside class="plan">
    <div class="side-hero"><div class="art-banner art-grain" id="sideArt"></div><div class="t"><small id="today"></small><b id="dayType"></b></div></div>
    <div id="list"></div>
    <div class="foot"><a class="ib" id="reportBtn" href="/report" target="_blank" rel="noopener" title="Open the latest timer report">Report</a></div>
  </aside>

  <main class="act">
    <div class="connect" id="connectPanel">
      <div class="qr" id="qr"></div>
      <div>
        <div class="lbl" style="margin-top:0">PIN</div><div class="pin" id="pinShow">····</div>
        <div class="lbl">Control link</div><small id="ctrlLink"></small>
        <div class="lbl">Display link</div><small id="dispLink"></small>
      </div>
    </div>

    <div class="banner" id="banner"></div>
    <div class="banner pace" id="pace"></div>
    <div class="banner" id="obsBanner"></div>

    <section class="clock" id="clock" data-state="idle">
      <div class="popup" id="popup"></div>
      <div class="sec" id="section">&nbsp;</div>
      <h2 class="nm" id="name">Loading…</h2>
      <div class="t" id="time">0:00</div>
      <div class="meta" id="meta"></div>
      <div class="bar"><i id="fill"></i></div>
    </section>

    <div class="main">
      <button class="go" id="go">Start</button>
      <button class="reset" id="second">Pause</button>
      <button class="reset" id="reset">Reset</button>
    </div>

    <div class="adj">
      <button data-d="-60">−1:00</button>
      <button data-d="-30">−0:30</button>
      <button data-d="30">+0:30</button>
      <button data-d="60">+1:00</button>
    </div>
    <div class="adjlabel">Adjust time for this part</div>

    <div class="scenes" id="scenes">
      <div class="srow"><label for="selScene">Scene for this part</label><select id="selScene"></select></div>
      <div class="srow" id="counselRow"><label for="selCounsel">Counseling scene</label><select id="selCounsel"></select></div>
    </div>
  </main>

  <aside class="check">
    <section><h4>The speaker sees</h4><div class="preview stage" id="pv" data-state="idle"><small id="pvName"></small><b id="pvTime">0:00</b></div></section>
    <section id="nowCard" hidden><h4>Current time</h4>
      <div class="clockcard"><div class="face art-circle art-grain" id="faceArt"></div><div><b id="now2"></b><span id="ends"></span></div></div></section>
    <section><h4>Connected</h4><div class="status">
      <div>This page <span class="st-pill" id="stLive"><i></i><span>Connecting</span></span></div>
      <div id="stObsRow" hidden>OBS <span class="st-pill" id="stObs"><i></i><span></span></span></div>
    </div></section>
  </aside>
</div>

<div class="gate" id="gate">
  <form id="gateForm">
    <h3>Enter PIN</h3>
    <p>Shown in the Stage Timer app on the host computer.</p>
    <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" autofocus>
    <div class="err" id="err"></div>
    <button type="submit">Unlock</button>
  </form>
</div>

<script src="/client.js"></script>
<script src="/art.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let pin = ''; try { pin = localStorage.getItem('stPin') || ''; } catch {}
  let state = null, listKey = '', online = false;

  $('sideArt').innerHTML = platformArt({ w: 640, h: 330, cx: 420, id: 'side' });
  $('faceArt').innerHTML = clockArt({ id: 'face' });

  const conn = ST.connect((s) => { state = s; render(); }, (ok) => {
    online = ok;
    $('conn').classList.toggle('on', ok);
    $('conn').lastElementChild.textContent = ok ? 'Live' : 'Reconnecting';
  });

  async function api(cmd, body) {
    const r = await fetch('/api/timer/' + cmd, { method: 'POST', headers: { 'content-type': 'application/json', 'x-pin': pin }, body: JSON.stringify(body || {}) });
    if (r.status === 401 || r.status === 429) { showGate((await r.json()).error); return null; }
    return r.json();
  }

  function showGate(msg) { $('err').textContent = msg || ''; $('gate').classList.add('show'); $('pin').value = ''; $('pin').focus(); }

  $('gateForm').onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch('/api/auth', { method: 'POST', headers: { 'x-pin': $('pin').value } });
    if (r.ok) { pin = $('pin').value; try { localStorage.setItem('stPin', pin); } catch {} $('gate').classList.remove('show'); }
    else $('err').textContent = (await r.json()).error;
  };

  fetch('/api/whoami').then((r) => r.json()).then(async (w) => {
    if (!w.pinRequired) return;
    const ok = pin && (await fetch('/api/auth', { method: 'POST', headers: { 'x-pin': pin } })).ok;
    if (!ok) showGate();
  });

  // Start / Stop(=done, move to next part) ; second button = Pause while running, Stop while paused
  const paused = () => state && !state.running && state.elapsedMs > 0;
  $('go').onclick = () => api(state && state.running ? 'stop' : 'start');
  $('second').onclick = () => api(paused() ? 'stop' : 'pause');
  $('reset').onclick = () => api('reset');

  // Connect panel (hidden until asked for) and settings
  $('connectBtn').onclick = async () => {
    const panel = $('connectPanel');
    if (panel.classList.toggle('show')) {
      const r = await fetch('/api/connect', { headers: { 'x-pin': pin } });
      if (r.status === 401 || r.status === 429) { panel.classList.remove('show'); return showGate((await r.json()).error); }
      const c = await r.json();
      $('qr').innerHTML = c.qr; $('pinShow').textContent = c.pin;
      $('ctrlLink').textContent = c.control; $('dispLink').textContent = c.display;
    }
    $('connectBtn').classList.toggle('on', panel.classList.contains('show'));
    $('connectBtn').textContent = panel.classList.contains('show') ? 'Hide' : 'Connect';
  };
  $('settingsBtn').onclick = () => api('../app/settings');
  fetch('/api/whoami').then((r) => r.json()).then((w) => $('settingsBtn').classList.toggle('show', !!w.local));
  const alerter = ST.alerter($('popup'));
  document.querySelectorAll('.adj button').forEach((b) => (b.onclick = () => api('adjust', { deltaSeconds: +b.dataset.d })));
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !$('gate').classList.contains('show') && !/^(SELECT|INPUT)$/.test(document.activeElement.tagName)) { e.preventDefault(); $('go').click(); }
  });

  function renderList() {
    const key = JSON.stringify(state.items.map((i) => [i.id, i.durationSecs, i.adaptedSecs, i.completedSecs])) + state.currentId;
    if (key === listKey) return;
    listKey = key;
    const list = $('list'); list.textContent = '';
    let section = null;
    for (const it of state.items) {
      if (it.sectionTitle !== section) {
        section = it.sectionTitle;
        const h = document.createElement('h2'); h.textContent = section; list.appendChild(h);
      }
      const b = document.createElement('button');
      b.className = 'part' + (it.id === state.currentId ? ' cur' : '');
      const changed = it.durationSecs !== it.originalSecs;
      const adapted = it.adaptedSecs != null && it.adaptedSecs !== it.durationSecs;
      b.innerHTML = '<span class="dot"></span><span class="n"></span><span class="d' + (adapted ? ' ad' : changed ? ' chg' : '') + '"></span>';
      b.querySelector('.n').textContent = it.name;
      const d = b.querySelector('.d');
      if (adapted) {
        const old = document.createElement('s'); old.textContent = ST.fmt(it.durationSecs); d.appendChild(old);
        d.appendChild(document.createTextNode(ST.fmt(it.adaptedSecs)));
      } else d.textContent = ST.fmt(it.durationSecs);
      if (it.completedSecs != null && it.id !== state.currentId) { b.classList.add('done'); d.textContent = '✓ ' + ST.fmt(it.completedSecs) + ' / ' + d.textContent; }
      if (it.id === state.currentId) b.setAttribute('aria-current', 'step');
      b.onclick = () => api('select', { talkId: it.id });
      list.appendChild(b);
    }
  }

  // Scene pickers for the current part. Choosing one while the part is running puts it on air right away.
  let scenesKey = '';
  function renderScenes() {
    const ob = state.obs;
    const cur = state.items.find((i) => i.id === state.currentId);
    const show = !!(ob && ob.enabled && cur);
    $('scenes').classList.toggle('show', show);
    if (!show) return;
    const counselPart = cur.section === 'ministry' && cur.isStudentTalk;
    $('counselRow').style.display = counselPart ? '' : 'none';
    const key = JSON.stringify([cur.key, ob.scenes, ob.assigned[cur.key], ob.counsel[cur.key], counselPart]);
    if (key === scenesKey || document.activeElement === $('selScene') || document.activeElement === $('selCounsel')) return;
    scenesKey = key;
    const fill = (sel, current, none, kind) => {
      sel.textContent = '';
      sel.add(new Option(none, ''));
      const names = ob.scenes.slice();
      if (current && !names.includes(current)) names.push(current);
      for (const n of names) sel.add(new Option(n, n));
      sel.value = current || '';
      sel.onchange = () => api('scene', { key: cur.key, scene: sel.value, kind });
    };
    fill($('selScene'), ob.assigned[cur.key], 'None (leave OBS as is)', 'scene');
    fill($('selCounsel'), ob.counsel[cur.key], 'Usual counseling scene', 'counsel');
  }

  const setPill = (el, tone, text) => { el.className = 'st-pill st-pill--' + tone; el.lastElementChild.textContent = text; };
  const putClock = (el, c) => { el.textContent = c.time; if (c.ampm) el.appendChild(document.createElement('small')).textContent = c.ampm; };

  function render() {
    if (!state) return;
    renderList();
    renderScenes();
    const dayType = state.meetingType === 'weekend' ? 'Weekend meeting' : 'Midweek meeting';
    $('sub').textContent = dayType + (state.circuitVisit ? ' · circuit visit' : '');
    $('dayType').textContent = dayType;
    $('today').textContent = new Date(state.serverNow).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const banner = $('banner');
    if (state.meetingType === 'midweek' && state.scheduleSource === 'none') {
      banner.style.display = 'block';
      banner.innerHTML = 'Couldn’t download this week’s schedule — using default times. <button id="retry">Try again</button>';
      $('retry').onclick = () => api('refresh');
    } else banner.style.display = 'none';
    $('reportBtn').classList.toggle('show', !!state.report);
    if (state.report) $('reportBtn').href = '/report?id=' + encodeURIComponent(state.report.id);
    const obsProblem = state.obs && state.obs.enabled ? state.obs.problem : null;
    $('obsBanner').style.display = obsProblem ? 'block' : 'none';
    $('obsBanner').textContent = obsProblem ? 'OBS scenes: ' + obsProblem : '';
    $('stObsRow').hidden = !(state.obs && state.obs.enabled);
    if (state.obs && state.obs.enabled) setPill($('stObs'), obsProblem ? 'warn' : 'ok', obsProblem ? 'Not connected' : 'Connected');
    const pace = $('pace');
    const o = state.overrunSecs;
    if (o != null) {
      const mins = Math.max(1, Math.round(Math.abs(o) / 60));
      pace.style.display = 'block';
      pace.textContent = (o < 0 ? 'Running about ' + mins + ' min behind' : 'Running about ' + mins + ' min ahead') +
        (state.adaptiveMode === 'none' ? '' : ' — upcoming parts adjust automatically.');
    } else pace.style.display = 'none';
    $('name').textContent = state.talk ? state.talk.name : 'No schedule';
    $('section').textContent = state.talk ? state.talk.section : ' ';
    $('go').textContent = state.running ? 'Stop' : (state.elapsedMs > 0 ? 'Resume' : 'Start');
    $('go').classList.toggle('stop', state.running);
    $('go').disabled = !state.talk;
    $('second').textContent = paused() ? 'Stop' : 'Pause';
    $('second').disabled = !state.talk || (!state.running && !paused());
  }

  // When the meeting will end if every part from here on takes its planned time
  function endsAt(nowMs) {
    const idx = state.items.findIndex((i) => i.id === state.currentId);
    if (idx < 0) return null;
    let ms = Math.max(0, state.targetSecs * 1000 - ST.elapsed(state, conn.offset()));
    for (const it of state.items.slice(idx + 1)) ms += (it.adaptedSecs != null ? it.adaptedSecs : it.durationSecs) * 1000;
    return new Date(nowMs + ms);
  }

  function tick() {
    if (state) {
      const v = ST.view(state, conn.offset());
      $('clock').dataset.state = v.state;
      $('time').textContent = v.text;
      $('fill').style.width = (v.progress * 100).toFixed(1) + '%';
      alerter(v.state, state.currentId);
      const nowMs = Date.now() + conn.offset();
      const showNow = !!(state.clock && state.clock.show);
      $('now').hidden = !showNow;
      $('nowCard').hidden = !showNow;
      if (showNow) {
        const c = ST.clockTime(new Date(nowMs), state.clock.format);
        putClock($('now'), c);
        putClock($('now2'), c);
        const end = endsAt(nowMs);
        const e = end && ST.clockTime(end, state.clock.format);
        $('ends').textContent = e ? 'Meeting ends around ' + e.time + (e.ampm ? ' ' + e.ampm : '') : '';
      }
      // Mirror of the speaker's screen (between parts it shows the time when the clock is on)
      const between = showNow && v.state === 'idle';
      $('pv').dataset.state = between ? 'now' : v.state;
      $('pvName').textContent = between ? 'Current time' : (state.talk ? state.talk.name : 'No schedule');
      if (between) putClock($('pvTime'), ST.clockTime(new Date(nowMs), state.clock.format));
      else $('pvTime').textContent = v.text;
      setPill($('stLive'), online ? 'ok' : 'danger', online ? 'Live' : 'Reconnecting');
      const orig = state.items.find((i) => i.id === state.currentId);
      const adapted = orig && orig.adaptedSecs != null && orig.adaptedSecs !== orig.durationSecs;
      $('meta').textContent = orig ? (adapted ? 'Adapted ' : 'Planned ') + ST.fmt(state.targetSecs) + (orig.originalSecs !== state.targetSecs ? ' (was ' + ST.fmt(orig.originalSecs) + ')' : '') + ' · ' + { idle: 'Ready', running: 'Running', minute: '1 minute left', half: '30 seconds left', ten: '10 seconds left', up: 'Time’s up', over: 'Over time', stopped: 'Paused' }[v.state] : '';
    }
    setTimeout(tick, 100);
  }
  tick();
</script>
</body>
</html>
