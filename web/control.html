<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Stage Timer Control</title>
<style>
  :root {
    --bg:#0b0e14; --card:#141923; --line:#232b3a; --fg:#eef1f7; --dim:#8a93a6;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff4d4d; --accent:#4c8dff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 12px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  button:disabled { opacity: .4; cursor: default; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header small { color: var(--dim); display: block; font-weight: 400; margin-top: 2px; }
  .conn { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .conn.on i { background: var(--ok); }

  .banner { background: #3a2b0a; color: #ffd48a; border: 1px solid #6b4d10; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px; display: none; }
  .banner.pace { background: #10233f; color: #a9c8ff; border-color: #24467d; }
  .banner button { background: transparent; color: inherit; text-decoration: underline; padding: 0 0 0 6px; }

  .clock { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 16px 14px; text-align: center; }
  .clock .sec { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .clock .nm { font-size: 18px; font-weight: 600; margin: 4px 0 2px; min-height: 24px; }
  .clock .t { font-size: 76px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; transition: color .2s; }
  .clock .meta { color: var(--dim); font-size: 13px; min-height: 18px; margin-top: 2px; }
  .bar { height: 8px; background: #232b3a; border-radius: 99px; overflow: hidden; margin: 12px 0 0; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); }
  [data-state="idle"] .t, [data-state="stopped"] .t { color: var(--dim); }
  [data-state="closing"] .t { color: var(--warn); } [data-state="closing"] .bar i { background: var(--warn); }
  [data-state="over"] .t { color: var(--bad); } [data-state="over"] .bar i { background: var(--bad); }

  .main { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 12px; }
  .go { height: 64px; border-radius: 16px; font-size: 22px; font-weight: 700; background: var(--ok); color: #05260f; }
  .go.stop { background: var(--bad); color: #2b0505; }
  .reset { height: 64px; padding: 0 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); font-size: 15px; }

  .adj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .adj button { height: 48px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .adj button:active, .reset:active { background: var(--line); }
  .adjlabel { text-align: center; color: var(--dim); font-size: 12px; margin-top: 6px; }

  h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; margin: 20px 4px 8px; }
  .part { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 6px; min-height: 48px; }
  .part .n { flex: 1; font-size: 15px; }
  .part .d { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 14px; }
  .part .d.chg { color: var(--accent); }
  .part .d.ad { color: var(--warn); }
  .part .d s { color: var(--dim); opacity: .7; margin-right: 6px; }
  .part.cur { border-color: var(--accent); background: #16213a; }
  .part.cur .n { font-weight: 700; }
  .part .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); }
  .part.cur .dot { border-color: var(--accent); background: var(--accent); }

  .gate { position: fixed; inset: 0; background: rgba(5,7,11,.92); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 10; }
  .gate.show { display: flex; }
  .gate form { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; width: 100%; max-width: 320px; text-align: center; }
  .gate h3 { margin: 0 0 4px; } .gate p { margin: 0 0 16px; color: var(--dim); font-size: 14px; }
  .gate input { width: 100%; font-size: 28px; letter-spacing: .4em; text-align: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  .gate .err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 8px 0; }
  .gate button { width: 100%; height: 48px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px; }

  /* Narrow OBS dock */
  @media (max-width: 380px) {
    body { padding: 8px 10px 16px; }
    .clock .t { font-size: 52px; } .go, .reset { height: 52px; font-size: 18px; } .reset { padding: 0 12px; }
    .adj button { height: 42px; font-size: 14px; } .part { padding: 9px 11px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Stage Timer<small id="sub"></small></h1>
  <div class="conn" id="conn"><i></i><span>Connecting</span></div>
</header>

<div class="banner" id="banner"></div>
<div class="banner pace" id="pace"></div>

<section class="clock" id="clock" data-state="idle">
  <div class="sec" id="section">&nbsp;</div>
  <div class="nm" id="name">Loading…</div>
  <div class="t" id="time">0:00</div>
  <div class="meta" id="meta"></div>
  <div class="bar"><i id="fill"></i></div>
</section>

<div class="main">
  <button class="go" id="go">Start</button>
  <button class="reset" id="reset">Reset</button>
</div>

<div class="adj">
  <button data-d="-60">−1:00</button>
  <button data-d="-30">−0:30</button>
  <button data-d="30">+0:30</button>
  <button data-d="60">+1:00</button>
</div>
<div class="adjlabel">Adjust time for this part</div>

<div id="list"></div>

<div class="gate" id="gate">
  <form id="gateForm">
    <h3>Enter PIN</h3>
    <p>Shown in the Stage Timer app on the host computer.</p>
    <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8" autofocus>
    <div class="err" id="err"></div>
    <button type="submit">Unlock</button>
  </form>
</div>

<script src="/client.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let pin = ''; try { pin = localStorage.getItem('stPin') || ''; } catch {}
  let state = null, listKey = '';

  const conn = ST.connect((s) => { state = s; render(); }, (ok) => {
    $('conn').classList.toggle('on', ok);
    $('conn').lastElementChild.textContent = ok ? 'Live' : 'Reconnecting';
  });

  async function api(cmd, body) {
    const r = await fetch('/api/timer/' + cmd, { method: 'POST', headers: { 'content-type': 'application/json', 'x-pin': pin }, body: JSON.stringify(body || {}) });
    if (r.status === 401 || r.status === 429) { showGate((await r.json()).error); return null; }
    return r.json();
  }

  function showGate(msg) { $('err').textContent = msg || ''; $('gate').classList.add('show'); $('pin').value = ''; $('pin').focus(); }

  $('gateForm').onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch('/api/auth', { method: 'POST', headers: { 'x-pin': $('pin').value } });
    if (r.ok) { pin = $('pin').value; try { localStorage.setItem('stPin', pin); } catch {} $('gate').classList.remove('show'); }
    else $('err').textContent = (await r.json()).error;
  };

  fetch('/api/whoami').then((r) => r.json()).then(async (w) => {
    if (!w.pinRequired) return;
    const ok = pin && (await fetch('/api/auth', { method: 'POST', headers: { 'x-pin': pin } })).ok;
    if (!ok) showGate();
  });

  $('go').onclick = () => api(state && state.running ? 'stop' : 'start');
  $('reset').onclick = () => api('reset');
  document.querySelectorAll('.adj button').forEach((b) => (b.onclick = () => api('adjust', { deltaSeconds: +b.dataset.d })));
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !$('gate').classList.contains('show')) { e.preventDefault(); $('go').click(); }
  });

  function renderList() {
    const key = JSON.stringify(state.items.map((i) => [i.id, i.durationSecs, i.adaptedSecs])) + state.currentId;
    if (key === listKey) return;
    listKey = key;
    const list = $('list'); list.textContent = '';
    let section = null;
    for (const it of state.items) {
      if (it.sectionTitle !== section) {
        section = it.sectionTitle;
        const h = document.createElement('h2'); h.textContent = section; list.appendChild(h);
      }
      const b = document.createElement('button');
      b.className = 'part' + (it.id === state.currentId ? ' cur' : '');
      const changed = it.durationSecs !== it.originalSecs;
      const adapted = it.adaptedSecs != null && it.adaptedSecs !== it.durationSecs;
      b.innerHTML = '<span class="dot"></span><span class="n"></span><span class="d' + (adapted ? ' ad' : changed ? ' chg' : '') + '"></span>';
      b.querySelector('.n').textContent = it.name;
      const d = b.querySelector('.d');
      if (adapted) {
        const old = document.createElement('s'); old.textContent = ST.fmt(it.durationSecs); d.appendChild(old);
        d.appendChild(document.createTextNode(ST.fmt(it.adaptedSecs)));
      } else d.textContent = ST.fmt(it.durationSecs);
      b.onclick = () => api('select', { talkId: it.id });
      list.appendChild(b);
    }
  }

  function render() {
    if (!state) return;
    renderList();
    const dayType = state.meetingType === 'weekend' ? 'Weekend meeting' : 'Midweek meeting';
    $('sub').textContent = dayType + (state.circuitVisit ? ' · circuit visit' : '');
    const banner = $('banner');
    if (state.meetingType === 'midweek' && state.scheduleSource === 'none') {
      banner.style.display = 'block';
      banner.innerHTML = 'Couldn’t download this week’s schedule — using default times. <button id="retry">Try again</button>';
      $('retry').onclick = () => api('refresh');
    } else banner.style.display = 'none';
    const pace = $('pace');
    const o = state.overrunSecs;
    if (o != null) {
      const mins = Math.max(1, Math.round(Math.abs(o) / 60));
      pace.style.display = 'block';
      pace.textContent = (o < 0 ? 'Running about ' + mins + ' min behind' : 'Running about ' + mins + ' min ahead') +
        (state.adaptiveMode === 'none' ? '' : ' — upcoming parts adjust automatically.');
    } else pace.style.display = 'none';
    $('name').textContent = state.talk ? state.talk.name : 'No schedule';
    $('section').textContent = state.talk ? state.talk.section : ' ';
    $('go').textContent = state.running ? 'Stop' : (state.elapsedMs > 0 ? 'Resume' : 'Start');
    $('go').classList.toggle('stop', state.running);
    $('go').disabled = !state.talk;
  }

  function tick() {
    if (state) {
      const v = ST.view(state, conn.offset());
      $('clock').dataset.state = v.state;
      $('time').textContent = v.text;
      $('fill').style.width = (v.progress * 100).toFixed(1) + '%';
      const orig = state.items.find((i) => i.id === state.currentId);
      const adapted = orig && orig.adaptedSecs != null && orig.adaptedSecs !== orig.durationSecs;
      $('meta').textContent = orig ? (adapted ? 'Adapted ' : 'Planned ') + ST.fmt(state.targetSecs) + (orig.originalSecs !== state.targetSecs ? ' (was ' + ST.fmt(orig.originalSecs) + ')' : '') + ' · ' + { idle: 'Ready', running: 'Running', closing: 'Wrap up', over: 'Over time', stopped: 'Stopped' }[v.state] : '';
    }
    setTimeout(tick, 100);
  }
  tick();
</script>
</body>
</html>
